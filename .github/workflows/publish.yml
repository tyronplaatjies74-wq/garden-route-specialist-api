name: Publish to MCP Registry

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Publish to MCP Registry
        uses: modelcontextprotocol/registry/tools/publisher@main